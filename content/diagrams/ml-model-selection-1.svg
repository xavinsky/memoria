<svg viewBox="0 0 900 300" width="100%" height="300" role="img" aria-label="Arbre de décision : target, puis type de tâche, puis famille de modèle"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="flow-arrow"></path></marker></defs><rect x="350" y="12" width="200" height="46" rx="9" class="flow-box q"></rect><text x="450" y="30" text-anchor="middle" class="flow-label q-label">Avez-vous une target y</text><text x="450" y="46" text-anchor="middle" class="flow-label q-label">à prédire ?</text><path d="M 400,58 L 400,80 L 185,80 L 185,102" class="flow-line" marker-end="url(#arrow)"></path><rect x="272" y="72" width="38" height="17" rx="8.5" class="edge-chip"></rect><text x="291" y="84" class="edge-text">Oui</text><path d="M 500,58 L 500,80 L 700,80 L 700,102" class="flow-line" marker-end="url(#arrow)"></path><rect x="616" y="72" width="42" height="17" rx="8.5" class="edge-chip"></rect><text x="637" y="84" class="edge-text">Non</text><rect x="90" y="104" width="190" height="46" rx="9" class="flow-box q"></rect><text x="185" y="122" text-anchor="middle" class="flow-label q-label">Continue ou</text><text x="185" y="138" text-anchor="middle" class="flow-label q-label">catégorielle ?</text><rect x="605" y="104" width="190" height="46" rx="9" class="flow-box q"></rect><text x="700" y="122" text-anchor="middle" class="flow-label q-label">Grouper ou</text><text x="700" y="138" text-anchor="middle" class="flow-label q-label">compresser ?</text><path d="M 140,150 L 140,168 L 95,168 L 95,190" class="flow-line" marker-end="url(#arrow)"></path><rect x="57" y="160" width="76" height="17" rx="8.5" class="edge-chip"></rect><text x="95" y="172" class="edge-text">Catégorielle</text><path d="M 230,150 L 230,168 L 285,168 L 285,190" class="flow-line" marker-end="url(#arrow)"></path><rect x="257" y="160" width="56" height="17" rx="8.5" class="edge-chip"></rect><text x="285" y